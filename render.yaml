services:
  - type: web
    name: campusnavigator-api
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromGroup: campusnavigator-db
      - key: SPRING_DATASOURCE_USERNAME
        fromGroup: campusnavigator-db
      - key: SPRING_DATASOURCE_PASSWORD
        fromGroup: campusnavigator-db
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://campusnavigator.masurii.dev,https://campusnavigator-indol.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update
      - key: PORT
        value: "8080"
