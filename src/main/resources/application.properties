spring.application.name=campusnavigator
spring.profiles.group.prod=production

server.port=${PORT:8080}

# Local development uses in-memory H2 unless another profile (for example, production) is enabled.
spring.datasource.url=jdbc:h2:mem:campusnavigatordb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Local frontend default; production overrides this from CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# JWT configuration placeholders for deployments that enable token authentication.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.error.include-stacktrace=never